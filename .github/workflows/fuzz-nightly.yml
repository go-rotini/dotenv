# The parser's fuzz targets for ten minutes each, every night. Pushes run every fuzz target for
# 60 seconds (make test-fuzz); this longer run reaches inputs a short one doesn't. A failing
# input is kept as an artifact: put it under testdata/fuzz/<target>/ to reproduce it with go test.
name: Nightly fuzz

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzExpand
          - FuzzLintAgrees
          - FuzzMapRoundTrip
          - FuzzMarshalEdit
          - FuzzMatchBraces
          - FuzzParser
          - FuzzRoundTrip
          - FuzzScanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true

      # go test -fuzz exits 0 when no target matches, so a renamed target would drop out silently.
      - name: Check the target exists
        run: |
          if ! go test -list "^${TARGET}\$" . | grep -qx "$TARGET"; then
            echo "::error::$TARGET is not a fuzz target in this package; update the matrix"
            exit 1
          fi

      # go test -fuzz can lose a race with its own -fuzztime and fail with a bare "context
      # deadline exceeded"; with no failing input written, that run passed (as in make test-fuzz).
      - name: Fuzz for 10 minutes
        run: |
          log=$(mktemp)
          status=0
          go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=10m . >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            if grep -q '^    context deadline exceeded$' "$log" && ! grep -q 'Failing input written' "$log"; then
              echo "fuzz time elapsed; deadline race in go test, no failing input"
            else
              exit "$status"
            fi
          fi

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
